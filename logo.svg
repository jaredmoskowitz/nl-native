<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f13"/>
      <stop offset="100%" stop-color="#1a1a24"/>
    </linearGradient>
    <linearGradient id="specGlow" x1="128" y1="120" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="iosGrad" x1="80" y1="300" x2="180" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F05138"/>
      <stop offset="100%" stop-color="#e8422a"/>
    </linearGradient>
    <linearGradient id="androidGrad" x1="200" y1="300" x2="310" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="100%" stop-color="#6B3FE8"/>
    </linearGradient>
    <linearGradient id="kotlinMark" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#7F52FF"/>
      <stop offset="37%" stop-color="#C811E2"/>
      <stop offset="100%" stop-color="#E54857"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="330" y1="300" x2="430" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Subtle grid texture -->
  <g opacity="0.04" stroke="#818cf8" stroke-width="0.5">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Spec document (top center) -->
  <g filter="url(#glow)">
    <rect x="176" y="80" width="160" height="180" rx="12" fill="url(#specGlow)" opacity="0.15"/>
    <rect x="176" y="80" width="160" height="180" rx="12" fill="none" stroke="url(#specGlow)" stroke-width="2"/>
  </g>

  <!-- Spec document lines -->
  <g opacity="0.9">
    <rect x="200" y="108" width="80" height="4" rx="2" fill="#818cf8"/>
    <rect x="200" y="124" width="112" height="3" rx="1.5" fill="#818cf8" opacity="0.5"/>
    <rect x="200" y="137" width="96" height="3" rx="1.5" fill="#818cf8" opacity="0.5"/>
    <rect x="200" y="150" width="104" height="3" rx="1.5" fill="#818cf8" opacity="0.5"/>
    <rect x="200" y="170" width="60" height="4" rx="2" fill="#818cf8"/>
    <rect x="200" y="186" width="112" height="3" rx="1.5" fill="#818cf8" opacity="0.5"/>
    <rect x="200" y="199" width="88" height="3" rx="1.5" fill="#818cf8" opacity="0.5"/>
    <rect x="200" y="212" width="100" height="3" rx="1.5" fill="#818cf8" opacity="0.5"/>
    <rect x="200" y="225" width="72" height="3" rx="1.5" fill="#818cf8" opacity="0.5"/>
  </g>

  <!-- Fan-out lines -->
  <g stroke-width="2" opacity="0.6">
    <line x1="220" y1="260" x2="140" y2="310" stroke="#F05138"/>
    <line x1="256" y1="260" x2="256" y2="310" stroke="#7F52FF"/>
    <line x1="292" y1="260" x2="372" y2="310" stroke="#fbbf24"/>
  </g>

  <!-- Fan-out arrow dots -->
  <circle cx="140" cy="310" r="4" fill="#F05138" filter="url(#softGlow)"/>
  <circle cx="256" cy="310" r="4" fill="#7F52FF" filter="url(#softGlow)"/>
  <circle cx="372" cy="310" r="4" fill="#fbbf24" filter="url(#softGlow)"/>

  <!-- iOS / Swift platform block -->
  <g filter="url(#softGlow)">
    <rect x="88" y="320" width="104" height="100" rx="10" fill="url(#iosGrad)" opacity="0.12"/>
    <rect x="88" y="320" width="104" height="100" rx="10" fill="none" stroke="url(#iosGrad)" stroke-width="1.5"/>
  </g>
  <!-- Swift bird logo (official path, scaled and positioned) -->
  <g transform="translate(112, 336) scale(0.22)" fill="#F05138" opacity="0.9">
    <path d="M144.7 38c84.4 57.4 57.1 120.7 57.1 120.7s24 27.1 14.3 50.8c0 0-9.9-16.6-26.5-16.6-16 0-25.4 16.6-57.6 16.6-71.7 0-105.6-59.9-105.6-59.9C91 192.1 135.1 162 135.1 162c-29.1-16.9-91-97.7-91-97.7 53.9 45.9 77.2 58 77.2 58-13.9-11.5-52.9-67.7-52.9-67.7 31.2 31.6 93.2 75.7 93.2 75.7C179.2 81.5 144.7 38 144.7 38z"/>
  </g>
  <text x="140" y="408" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F05138">Swift</text>

  <!-- Android platform block -->
  <g filter="url(#softGlow)">
    <rect x="204" y="320" width="104" height="100" rx="10" fill="url(#androidGrad)" opacity="0.12"/>
    <rect x="204" y="320" width="104" height="100" rx="10" fill="none" stroke="url(#androidGrad)" stroke-width="1.5"/>
  </g>
  <!-- Kotlin logo mark -->
  <g transform="translate(230, 336)" opacity="0.9">
    <g transform="scale(0.0192)">
      <path d="M2501.34 2500H0V0h2501.34L1224.87 1231.44z" fill="url(#kotlinMark)"/>
    </g>
  </g>
  <text x="256" y="408" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#7F52FF">Kotlin</text>

  <!-- Backend platform block -->
  <g filter="url(#softGlow)">
    <rect x="320" y="320" width="104" height="100" rx="10" fill="url(#backendGrad)" opacity="0.12"/>
    <rect x="320" y="320" width="104" height="100" rx="10" fill="none" stroke="url(#backendGrad)" stroke-width="1.5"/>
  </g>
  <!-- Database/server icon -->
  <g transform="translate(352, 344)" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.9">
    <ellipse cx="20" cy="6" rx="16" ry="6"/>
    <path d="M4 6 L4 30 Q4 36 20 36 Q36 36 36 30 L36 6"/>
    <path d="M4 16 Q4 22 20 22 Q36 22 36 16" opacity="0.5"/>
    <path d="M4 26 Q4 32 20 32 Q36 32 36 26" opacity="0.5"/>
  </g>
  <text x="372" y="408" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#fbbf24">Backend</text>

  <!-- NL NATIVE text -->
  <text x="256" y="478" text-anchor="middle" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="28" font-weight="800" letter-spacing="6" fill="#e4e4e7" opacity="0.9">NL NATIVE</text>
</svg>
